name: Sync showcases from GitLab

# 定时轮询源工蜂仓库：docs/ 下的 html 有新增或内容变更时，自动提交到本仓库，
# 从而触发 GitHub Pages 自动重建。
# 同步范围：
#   docs/*.html —— 展示页 HTML（自包含，不含外部素材；docs/assets 体积过大，不参与同步）
#   docs/*.md   —— Markdown 源文档，落地页卡片文案以它为准
#   scripts/    —— 落地页生成脚本与中文译文，保证 GitHub Pages 用的是最新脚本
#   Readme.md   —— 落地页分类来源（本仓库落地为 README.md）
on:
  schedule:
    # 每 30 分钟同步一次；需要更实时可改成 '*/5 * * * *'
    - cron: '*/30 * * * *'
  workflow_dispatch: {}      # 支持在 GitHub 网页上手动触发

permissions:
  contents: write            # 允许 push 回本仓库

concurrency:
  group: sync-showcases
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone source GitLab repo
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 1 --branch master \
            "https://private:${GITLAB_TOKEN}@git.tencent.com/rdec/ai_show_cases.git" /tmp/src

      - name: Refresh docs/ (html + markdown)
        run: |
          mkdir -p docs
          rm -f docs/*.html docs/*.md   # 先清掉旧的，保证源仓库删除也能同步
          cp /tmp/src/docs/*.html docs/ 2>/dev/null || true
          cp /tmp/src/docs/*.md docs/ 2>/dev/null || true
          echo "--- docs/ ---"
          ls -1 docs/

      - name: Refresh scripts/ and Readme
        run: |
          mkdir -p scripts
          rm -f scripts/*.py scripts/*.json
          cp /tmp/src/scripts/*.py scripts/ 2>/dev/null || true
          cp /tmp/src/scripts/*.json scripts/ 2>/dev/null || true
          cp /tmp/src/Readme.md README.md

      - name: Generate landing page (docs/index.html)
        run: |
          python3 scripts/generate_index.py
          cp public/index.html docs/index.html
          echo "--- index generated ---"

      - name: Commit & push if changed
        run: |
          git add docs/ scripts/ README.md
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "sync: update showcases $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin "HEAD:${GITHUB_REF_NAME}"
